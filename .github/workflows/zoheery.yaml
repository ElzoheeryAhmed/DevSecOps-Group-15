name: zoheery-workflow
run-name: "${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        default: dev
        options:
          - dev
          - prod

jobs:
  dev-job:
    if: ${{ inputs.environment == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout step
        uses: actions/checkout@v7
      - name: setup of Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13t'
      - run: echo 'My name is zoheery Development' >> file.txt
      - run: ls -la

  prod-job:
    if: ${{ inputs.environment == 'prod' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'My name is zoheery Production' >> file.txt
      - run: cat file.txt
